[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfluff-personal-layout"
version = "0.1.0"
description = "Reusable T-SQL formatting with readable CASE expressions"
requires-python = ">=3.11"
dependencies = ["sqlfluff==4.4.0"]

[project.entry-points.sqlfluff]
personal_layout = "sqlfluff_personal_layout"

[tool.setuptools.packages.find]
where = ["src"]
