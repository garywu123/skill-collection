# cross-agent configuration. Prefer requesting cross-agent initiate in chat;
# the Skill infers commands and calls init to add the project's section safely.
# For manual setup, copy to <project-root>/.cross-agent/config.toml, or point
# CROSS_AGENT_CONFIG at another private path, then edit. init reads this template
# only when creating a configuration; subsequent calls read project config only.
# Runtime settings, complete roles, selected CLI paths, and project fields are
# required. Missing values are errors; there are no Python or CLI defaults.
# A run keeps the role settings it started with.

# Reviews per run, segment reviews included. Each review that leaves an
# accepted finding allows one Producer revision. Raise it (e.g. 12) when
# enabling segment_review: it must cover max_segment_reviews plus
# final_review_reserve.
max_reviews = 5

# Hard minutes per worker call or check command; activity never extends it.
# Producer transient recovery is capped at one per run; checkpoints keep budgets.
timeout_minutes = 30

# Start a fresh worker session when the previous call's context exceeded this
# many tokens, per role. A single integer applies to both roles. 0 turns
# rotation off; Claude Code and Codex also compress context on their own.
rotate_at_tokens = { producer = 250000, reviewer = 400000 }

# After a Delivery execution checkpoint the Producer continues in the same
# session ("resume") or starts a new one ("fresh", the behavior of configs
# without this key). Rotation still follows rotate_at_tokens.
checkpoint_session = "resume"

# Review each Delivery checkpoint segment against its planned outcomes before
# the next segment; the final review still reads the whole run. Each segment
# gets at most max_segment_reviews automatic reviews, and a segment review is
# skipped when it would leave fewer than final_review_reserve reviews.
segment_review = false
max_segment_reviews = 3
final_review_reserve = 2

# Who adjudicates review findings: "orch" (Orch decides every finding) or
# "auto" (rules accept blocker/major, keep minor as notes, and escalate to Orch
# only Reviewer needs_user_decision findings and exhausted segment budgets).
# Prefer recording the user's delegation per run with start --adjudication auto.
adjudication = "orch"

# Write rejected findings to docs/review-backlog.md when a run closes.
backlog_rejected = true

# A review fails when the changes it must read exceed this size.
max_diff_kb = 200

# Required CLI selection for each provider used by a role. Replace these example
# paths with installed executables, or supply a cli object in the init input.
# No PATH fallback is used when an entry is missing or invalid.
[cli]
codex = "C:/Tools/Codex/codex.exe"
claude = "C:/Tools/Claude/claude.exe"

# To share settings, a project's local config contains only:
# config_file = "../../workspace/.cross-agent/config.toml"
# The referenced file holds all settings and explicit project-root sections.

[defaults]
# Syntax: <provider>:<model>:<effort>, with provider "claude" or "codex".
# All three fields are required. "claude", "codex", and "codex::high" are errors.
# An explicit model ID pins the version; aliases may change their target model.
# Model/effort support below is a 2026-10-03 snapshot, not an enforced allowlist;
# availability depends on the selected CLI, provider, account, and workspace.
# Cross-agent forwards model/effort unchanged; it does not validate model access.
#
# Codex models and effort:
#   gpt-6.1-sol, gpt-6-astra, gpt-6-sol:
#     low, medium, high, xhigh, max, ultra
#   gpt-6-luna: low, medium, high, xhigh, max (no ultra)
# Inspect current choices with codex /model, or codex debug models.
# Source: https://learn.chatgpt.com/docs/models
#
# Claude model aliases (use lowercase): opus, sonnet, haiku, fable, best, opusplan.
# Aliases can resolve to newer versions; opusplan uses Opus for planning and
# Sonnet for execution. Full Anthropic IDs include claude-opus-5-5,
# claude-sonnet-5-5, and claude-fable-5-1; other providers use their own IDs.
# Sonnet 5.5 requires CLI >= 2.1.284; Opus 5.5 requires >= 2.1.280.
# Claude effort by model:
#   Opus 5.5/5/4.8/4.7, Sonnet 5.5/5, Fable 5.1/5:
#     low, medium, high, xhigh, max
#   Opus 4.6 / Sonnet 4.6: low, medium, high, max (no xhigh)
#   Haiku: no documented effort support; unsuitable for these required-effort roles.
# Opus 5.5 / Sonnet 5.5 default to medium; Opus 4.7 to xhigh;
# other supported models default to high, unless settings override the default.
# Source: https://code.claude.com/docs/en/model-config
#
# Ordinary levels: low = quick tasks; medium = balanced; high = deeper checks;
# xhigh = extra reasoning; max = deepest single-model reasoning.
# Levels are calibrated per model, not equivalent across models/providers.
# Codex ultra and Claude ultracode enable workflows involving subagents.
# Claude ultracode requests xhigh plus that workflow (CLI >= 2.1.203).
# Use these only for Producers when the stage's delegation rules permit them;
# Reviewers must remain read-only and must not delegate.
#
# Examples (replace a role value below; do not add a duplicate TOML key):
# producer = "claude:claude-opus-5-5:medium" # fixed model and explicit effort
# producer = "claude:sonnet:high"          # moving alias and explicit effort
# reviewer = "codex:gpt-6.1-sol:xhigh"     # fixed model and explicit effort
producer = "claude:claude-opus-5-5:medium"
reviewer = "codex:gpt-6.1-sol:xhigh"

# Optional per-stage settings for feature-map, feature-plan, feature-delivery,
# or general. producer/reviewer use the complete syntax above and replace the
# default for that stage; a start --producer/--reviewer override still wins.
# Lifecycle Skills are found next to cross-agent; override a path only when
# needed. general loads a Skill only when skill is set here, for every general
# run using this file.
# [stages.feature-delivery]
# producer = "claude:claude-opus-5-5:high"
# [stages.feature-plan]
# skill = "C:/Users/<you>/.agents/skills/feature-plan/SKILL.md"

# Optional domain-expert routing, selected with start --skill <name>.
# Same Producer handles exploration and production; Reviewer is independent.
# Precedence: run role override > selected expert > stage > defaults.
# Existing configurations without these tables keep their current behavior.
# Paths/IDs above remain explicit; Orch is the current conversation and is not
# selected here. Either Claude or Codex Orch can launch the configured workers.
# Direct interactive exploration is verified for Claude only; Codex workers
# continue to support managed production/review and Orch-mediated discussion.
[experts.product-brief]
producer = "claude:claude-opus-5-5:high"
reviewer = "codex:gpt-6.1-sol:high"

[experts.architecture-design]
producer = "claude:claude-opus-5-5:high"
reviewer = "codex:gpt-6.1-sol:xhigh"

[experts.feature-map]
producer = "claude:claude-opus-5-5:high"
reviewer = "codex:gpt-6.1-sol:high"

[experts.feature-storyboard]
producer = "claude:claude-opus-5-5:high"
reviewer = "codex:gpt-6.1-sol:high"

# Delivery uses existing stage/default roles unless explicitly overridden.
# No always-on Tester: use standalone validation for a concrete coverage gap.

# Required project commands and directories. '.' keeps the checkout portable.
# Empty lists are explicit choices, not missing settings. init replaces them
# with project input when supplied; e.g. allowed_commands = ["dotnet test"].
[projects."."]
allowed_commands = []
# Rerun after every Producer revision: keep only the Testing Strategy's fast
# class here; Feature gate suites (UI flows, capacity) run once per Feature.
delivery_checks = []
extra_dirs = []
# Optional: map a delivery_checks command to the JUnit XML report it writes, so
# the Reviewer's test-change summary can show counts for that command only.
# Without it, or with a stale/ambiguous report, counts stay unknown.
# test_reports = { "python -m pytest --junitxml=reports/unit.xml" = "reports/unit.xml" }
# Optional: map a delivery_checks command to repository-relative fnmatch globs
# ('*' also matches '/'). After a Producer round the check reruns only when a
# changed path matches or its last result failed; unmapped checks always run.
# check_paths = { "npm test" = ["frontend/*", "src/Api/Contracts/*"] }
