# cross-agent configuration. Prefer requesting cross-agent initiate in chat;
# the Skill infers commands and calls init to add the project's section safely.
# For manual setup, copy to <project-root>/.cross-agent/config.toml, or point
# CROSS_AGENT_CONFIG at another private path, then edit. Every key is optional;
# the values below are the defaults. A run keeps the settings it started with.

# Reviews per run. Each review that leaves an accepted finding allows one
# Producer revision.
max_reviews = 2

# Hard minutes per worker call or check command; activity never extends it.
# Producer transient recovery is capped at one per run; checkpoints keep budgets.
timeout_minutes = 30

# Start a fresh worker session when the previous call's context exceeded this
# many tokens. 0 turns rotation off; Claude Code and Codex also compress
# context on their own.
rotate_at_tokens = 350000

# Write rejected findings to docs/review-backlog.md when a run closes.
backlog_rejected = true

# A review fails when the changes it must read exceed this size.
max_diff_kb = 200

# Optional CLI selection. Use absolute paths; omitted providers use PATH.
# [cli]
# codex = "C:/Tools/Codex/codex.exe"
# claude = "C:/Tools/Claude/claude.exe"

# To share settings, a project's local config contains only:
# config_file = "../../workspace/.cross-agent/config.toml"
# The referenced file holds all settings and explicit project-root sections.

[defaults]
# <provider>[:<model>[:<effort>]]. An empty model keeps the provider's default.
# Example: reviewer = "codex::high" sets effort without fixing a model.
# Example: producer = "claude:opus:high" sets both, when supported by that CLI.
producer = "claude:Opus:medium"
reviewer = "codex::high"

# Stage Skills are found next to cross-agent. Override a path only when needed.
# [stages.feature-plan]
# skill = "C:/Users/<you>/.agents/skills/feature-plan/SKILL.md"

# Local project commands and directories. '.' keeps the checkout portable.
# [projects."."]
# allowed_commands = ["dotnet build", "dotnet test"]           # the Producer may run these
# delivery_checks = ["dotnet build Example.slnx", "dotnet test Example.slnx"] # feature-delivery and general
# extra_dirs = ["../shared-library"]                           # readable, and writable by the Producer
